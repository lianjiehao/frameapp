name: Quality checks

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  FLUTTER_VERSION: '3.47.6'

jobs:
  quality:
    name: Code quality
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: false
      - run: flutter pub get --enforce-lockfile
      - run: dart format --output=none --set-exit-if-changed lib test
      - run: flutter analyze --fatal-infos
      - run: flutter test --coverage
      - name: Check developer documentation
        run: python3 tools/check_docs.py
      - name: Validate tooling and generated pages
        run: |
          python3 -m unittest discover -s tools/tests
          python3 tools/build_policy_pages.py
          git diff --exit-code -- assets/legal lib/services/policy_pages.g.dart
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: test-coverage
          path: coverage/lcov.info
          retention-days: 14

  android:
    name: Android build
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: false
      - run: flutter pub get --enforce-lockfile
      - run: flutter build apk --debug
      - name: Inspect final APK permissions
        run: python3 tools/check_android_permissions.py build/app/outputs/flutter-apk/app-debug.apk
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: android-test-apk
          path: build/app/outputs/flutter-apk/app-debug.apk
          retention-days: 14

  ios:
    name: iOS build
    runs-on: macos-15
    timeout-minutes: 40
    env:
      PERMISSION_NOTIFICATIONS: '0'
      DEVELOPER_DIR: /Applications/Xcode_26.3.app/Contents/Developer
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: false
      - name: Set iOS permission configuration
        run: echo "PERMISSION_HANDLER_INFO_PLIST=$GITHUB_WORKSPACE/ios/Runner/Info.plist" >> "$GITHUB_ENV"
      - run: flutter pub get --enforce-lockfile
      - run: flutter build ios --release --no-codesign
