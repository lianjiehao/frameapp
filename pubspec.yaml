name: framecoach
description: A local composition coach for iOS and Android.
publish_to: none
version: 0.1.15+16
environment:
  sdk: '>=3.12.0 <4.0.0'
dependencies:
  flutter:
    sdk: flutter
  camera: ^0.12.1
  gal: ^2.3.3
  web: ^1.1.1
  sensors_plus: ^7.1.1
  shared_preferences: ^2.5.6
  webview_flutter: ^4.14.1
  url_launcher: ^6.3.3
  permission_handler: 12.0.1
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
flutter:
  uses-material-design: true
  assets:
    - assets/images/park.jpg
    - assets/legal/
  fonts:
    - family: FrameSans
      fonts:
        - asset: assets/fonts/FrameSans-Regular.ttf
    - family: Editorial
      fonts:
        - asset: assets/fonts/DMSerifDisplay-Regular.ttf
